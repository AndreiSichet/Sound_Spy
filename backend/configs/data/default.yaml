# Training data (step 04): datasets, foreground/background roles, splits, mixture recipes.
# Every key is required and validated when the configuration is loaded.

datasets:
  esc50:  {enabled: true}
  fsd50k: {enabled: true}
  custom: {enabled: true}
  librispeech: {enabled: true, class: speech}   # read speech (CC BY 4.0), step 07b: every
                                     # utterance is a foreground clip of this class

roles:
  min_fg_clips_warning: 100          # warn if a class has fewer train foreground clips

activity:
  hop_s: 0.1                         # RMS envelope resolution
  threshold_db_below_peak: 30        # frames within 30 dB of the clip peak count as active

splits:
  esc50:  {train: [1, 2, 3], val: [4], test: [5]}   # official folds
  fsd50k:
    # eval = test (official). Dev train/val is made uploader-disjoint, then whole training
    # uploaders move to val until every class has at least this many val clips.
    min_val_clips_per_class: 40
  custom: {val_fraction: 0.15, test_fraction: 0.15, seed: 0}   # split by recording session
  # LibriSpeech: split = official subset (their speakers are disjoint by construction)
  librispeech: {train: train-clean-100, val: dev-clean, test: test-clean}

mixtures:
  duration_s: 6.0
  counts: {train: 20000, val: 2000, test: 2000}
  seed: {train: 1, val: 2, test: 3}
  n_foreground: [1, 3]               # distinct foreground classes per mixture (inclusive range)
  n_background: [1, 3]
  target_size: [1, 2]                # how many of the present fg classes form the target
  empty_target_prob: 0.05            # some mixtures have a target class that is absent (output = silence)
  event_min_s: 0.5                   # shortest event placed in a mixture
  fg_gain_db: [-5, 5]                # per-event gain range relative to reference loudness
  bg_gain_db: [-15, 0]
  target_to_rest_db: [-10, 10]       # target sum vs. everything else, sampled per mixture
  peak_limit: 0.99                   # rescale whole mixture (and target) if exceeded
  reference_rms_dbfs: -25            # every event is normalised to this RMS (active frames) before gain_db

  # --- step 07b. The values here reproduce the recipe files generated before it (val and test
  # stay frozen, so results remain comparable); training uses the `dynamic` overrides below.
  partial_target_prob: 0.0           # share of recipes whose target sounds only before or only
                                     # after one moment ("switch"), so that a training crop
                                     # around it holds the target switching on or off
  partial_switch: [0.3, 0.7]         # where that moment lies, as a share of the duration
  hard_negative_prob: 0.0            # absent target: chance that one foreground event is
                                     # replaced by a class the target is confused with
  hard_negative_pairs: {}            # selected class -> classes mistaken for it
  source_mix:                        # class -> {dataset: share of its clips from that dataset};
    speech: {librispeech: 0.0}       # the rest comes from the other datasets. 0 = never
  lowpass_prob: 0.0                  # per foreground event: random low-pass filter
  lowpass_hz: [6000, 16000]          # its cut-off range (log-uniform)

  dynamic:                           # mixtures made on the fly while training the extractor
    empty_target_prob: 0.15          # 3x more "the selected class is not there" than before
    partial_target_prob: 0.25
    hard_negative_prob: 0.5
    # From the step-07 failure analysis (project_insights.md, Chapter 14): which class the v1
    # model kept instead of the selected one, in the 51 test mixtures it made worse by more than
    # 5 dB and in the validation set; pairs seen in both. (Most often it kept a BACKGROUND clip,
    # 33 of 51, which no class pair can express.) speech -> music: the owner's listening test
    # (classical music audible under "Speech") and 2 validation cases.
    hard_negative_pairs:
      speech: [music]
      music: [alarm, speech]
      chair_scrape: [alarm, dishes, music]
      dishes: [chair_scrape, music, alarm]
      traffic: [footsteps]
      footsteps: [traffic]
    source_mix:
      speech: {librispeech: 0.5}     # half read speech (LibriSpeech), half everyday speech (FSD50K)
    lowpass_prob: 0.3                # LibriSpeech is 16 kHz (nothing above 8 kHz): without this
                                     # the model could learn "band-limited = speech"
