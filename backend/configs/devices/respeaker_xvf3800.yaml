# Device profile: ReSpeaker XVF3800 4-mic USB array (module 3 onward).
# Placeholder until the hardware arrives.

# Input device: case-insensitive name substring as listed by `soundspy devices`.
device: "reSpeaker"

# Host API: null = preference order (Windows WASAPI first).
hostapi: null

# Sample rate in Hz: null = the device's native rate.
sample_rate: null

# 6-channel firmware: ch0-1 = processed (beamformed/AEC) outputs, ch2-5 = raw mics.
# The device is opened with max(raw_channels) + 1 = 6 channels and channels 2-5 are kept.
raw_channels: [2, 3, 4, 5]

# TODO(module-3): mic coordinates in metres from the datasheet (one [x, y, z] per kept channel)
geometry: null
