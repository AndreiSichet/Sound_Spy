# Hybrid extraction (step 07c): silence when the selected sound is absent, separation when sounds
# overlap. Three parts, each doing what it was measured to do best:
#   * Speech selected alone -> a dedicated speech enhancer, DeepFilterNet3 (separates a voice
#     from music and noise, which both earlier methods could not);
#   * any other selection -> the Waveformer (neural_tse.yaml, the step-07 model v1);
#   * after either: a gate that the DETECTOR closes when it is sure nothing selected is there
#     (the baseline's silent pauses) and the EXTRACTOR's output reopens at once (word starts).

speech:
  labels: [speech]               # a selection of exactly these classes goes to the speech route;
                                 # speech together with other classes goes to the Waveformer (two
                                 # extractors summed would count the shared sound twice)
  route: enhancer                # enhancer: DeepFilterNet3 on the input
                                 # cascade: Waveformer (Speech), then DeepFilterNet3 (evaluated
                                 # in step 07c; +40 ms more delay and both models per chunk)
  model:                         # DeepFilterNet3, release 0.5.6 (Schroeter et al., MIT / Apache-2.0)
    file: DeepFilterNet3.zip     # -> <model_cache>/deepfilternet/ (soundspy data download deepfilternet)
    url: https://github.com/Rikorose/DeepFilterNet/raw/v0.5.6/models/DeepFilterNet3.zip
    sha256: 49c52edc8947ae1f9bf50d81530beaf3a2c3245aeaf34b6f31ff535cd22284d2
  atten_lim_db: null             # DeepFilterNet's own attenuation limit: none, so that the
                                 # session's slider is the only attenuation control
  post_filter: false             # DeepFilterNet's optional post-filter (a little extra noise
                                 # reduction between harmonics)
  device: cpu                    # cpu | cuda | auto (= cpu): the graphics card is the Waveformer's
  backend: onnx                  # onnx: the streaming step exported once and run by ONNX Runtime
                                 # (2.6 ms per 20 ms chunk on the laptop); torch: PyTorch (8-16 ms)
  cpu_threads: 1                 # ONNX Runtime / PyTorch threads of the speech enhancer
  input_gain_db: 10              # the speech enhancer sees the input this much louder (its output
                                 # is turned down again: the level is unchanged). From a cold start
                                 # DeepFilterNet3 treats very quiet input as noise: on the laptop
                                 # microphone (speech peaks ~-29 dBFS) it removed the owner's
                                 # speech for 5-10 s (real-room benchmark, and heard live, 19 Nov).
                                 # Chosen without the benchmark: the smallest gain that removes the
                                 # cold-start loss on the owner's earlier recordings and costs
                                 # <= 0.3 dB on validation (0 / 10 / 20 / 30 dB: val SI-SDRi of the
                                 # speech route +8.70 / +8.61 / +7.76 / +6.40; validation mixtures
                                 # are ~-27 dBFS, 10-20 dB louder than this microphone)

gate:                            # HybridGate (extraction/hybrid_gate.py)
  enabled: true                  # the page's "Gate" switch turns it off for a session
  close_prob_factor: 0.5         # close only when every selected class's smoothed detector
                                 # probability is below this x its own threshold ("sure") ...
  close_hold_ms: 400             # ... for this long, with no output rise for this long either
  close_ms: 150                  # closing ramp
  open_ms: 5                     # opening ramp (a word start must not wait)
  reopen_ratio_db: -6            # the extractor's output this close to the input's level or
                                 # closer: open at once, whatever the detector says
                                 # close_prob_factor / close_hold_ms / reopen_ratio_db: chosen by
                                 # `soundspy evaluate hybrid-gate` on validation (2026-11-18,
                                 # 320 recipes, live detector, tuning rule below): SI-SDRi +4.68
                                 # -> +3.77 dB (offline detector +4.69), target absent -12.6 ->
                                 # -17.4 dB, music only with Speech selected -25.6 -> -34.8 dB
                                 # (offline -44.3) at 30 dB
  attack_ms: 5                   # level envelopes of output and input: rise ...
  release_ms: 50                 # ... and fall
  min_level_dbfs: -60            # an input quieter than this cannot reopen the gate
  block_ms: 1                    # decision grid (no added latency: a decision applies to the
                                 # next millisecond)
  warmup_ms: 1000                # after the speech enhancer starts, its output does not reopen
                                 # the gate for this long (only the detector does): it leaks
                                 # until it has heard enough. Measured, DeepFilterNet3 on the
                                 # owner's classical recording: estimate -9 dB against the input
                                 # in the first second, -18 dB in the second, below -75 dB
                                 # afterwards. (The Waveformer has no such start-up leak.)
                                 # Validation (400 / 0.5 / -10): 2 s cost the speech route 2.2 dB
                                 # SI-SDRi with the live detector (1 s: 0.8, 0 s: 0.5) for
                                 # -44.3 / -43.0 / -40.6 dB on "music only, Speech selected"
                                 # offline: 1 s
  start_closed: true             # a stream that starts with a selection (offline runs, a
                                 # session started with chips selected) starts closed; the
                                 # detector or (after warmup_ms) the output opens it. Needs the
                                 # detector: without one the gate starts open

speech_gate:                     # SpeechRouteGate (extraction/speech_gate.py, step 07d): the gate of
                                 # the SPEECH ROUTE, driven by DeepFilterNet3's own output. r =
                                 # level of its output - level of its input (dB): music only -30
                                 # to -45, speech about -5 (tuning session, 19 Nov). The "gate"
                                 # above stays the Waveformer route's gate
  enabled: true                  # the page's "Gate" switch turns both gates off
  close_db: -12                  # r below this ...
  close_hold_ms: 100             # ... for this long without a break: close
  close_ms: 50                   # closing ramp
  open_db: -9                    # r above this: open (above close_db: no chattering)
                                 # close_db / close_hold_ms / open_db: chosen by `soundspy
                                 # evaluate speech-gate` (19 Nov) on validation + the tuning
                                 # session 20261119-105248-00c1 (60 s mixtures, live detector,
                                 # rule in speech_tuning): short pauses -34.4 -> -35.7 dB, speech
                                 # cut 0.5 -> 0.2 %, worst start leak 0.76 -> 0.22 s, classical at
                                 # 0 dB -0.29 dB, val Speech alone +4.72 -> +6.62 dB against the
                                 # 07c gate (spec defaults -15 / 150 / -12: -35.2 dB, but music
                                 # only -32.4 instead of -45.4: DeepFilterNet3's own music leaks
                                 # reopened the gate)
  open_ms: 5                     # opening ramp (a word start must not wait)
  close_hold_confident_ms: 50    # the hold when the detector is SURE nothing selected is there
  detector_override_max_ms: 1000 # the hold while the detector says "speech": the detector alone
                                 # never closes the gate (r must be low) and never keeps it open
                                 # for longer than this while r stays low. Not in the spec's
                                 # tuning grid; measured on the tuning data (live, 40 dB, with
                                 # -12 / 150 / -9): 150 / 300 / 500 / 1000 ms -> short pauses
                                 # -38.0 / -37.1 / -36.4 / -35.7 dB, pop at 0 dB 0.56 / 0.40 /
                                 # 0.28 / 0.18 dB below the 07c gate (classical 0.20-0.24):
                                 # 500 and 1000 keep the 0.3 dB rule; the spec's 1000 is kept
  close_prob_factor: 0.5         # "sure" = probability below this x the class threshold
  ratio_attack_ms: 5             # level envelopes of output and input: rise ...
  ratio_release_ms: 50           # ... and fall
  min_level_dbfs: -60            # an input quieter than this cannot open the gate
  block_ms: 1                    # decision grid (no added latency)
  warmup_ms: 0                   # after the speech route starts, r is not used for this long (the
                                 # gate stays closed). Tuning session: 0 ms already leaks at most
                                 # 0.22 s at a stream start; 300 / 500 / 1000 ms cut the word
                                 # starts (speech-start cut 4.2 / 13 / 28 %, val Speech alone
                                 # +5.9 / +4.6 / +2.9 dB instead of +6.6)
  start_closed: true             # a stream (or the speech route when it starts) starts closed and
                                 # opens when r > open_db (speech appears)

live:
  ramp_ms: 20                    # crossfade between routes and pass-through
  performance_cores: true        # keep the audio thread on the CPU's performance cores (Intel
                                 # 12th gen and later have slower efficiency cores; measured on
                                 # the laptop: DeepFilterNet step p95 11.5 -> 5.5 ms)

tuning:                          # soundspy evaluate hybrid-gate (validation recipes, never test)
  close_prob_factor: [0.3, 0.5, 0.8]
  close_hold_ms: [200, 400, 800]
  reopen_ratio_db: [-6, -10, -14]
  max_cost_db: 1.0               # the strongest target-absent suppression (live detector)
                                 # whose SI-SDRi cost against no gate stays within this. (0.3 as
                                 # in step 07b is met by no setting with the live detector: its
                                 # lag alone costs ~0.9 dB; offline the gate costs ~0.05 dB)

speech_tuning:                   # soundspy evaluate speech-gate (validation recipes + the tuning
                                 # real-room session; never the held-out session, never test)
  close_db: [-20, -15, -12]
  open_db: [-14, -12, -9]        # only combinations with open_db > close_db
  close_hold_ms: [100, 150, 250]
  max_speech_cut: 0.02           # speech-cut rate allowed on the tuning session (live detector)
  max_cost_db: 0.3               # speech over music: SI-SDRi at most this below the 07c gate
