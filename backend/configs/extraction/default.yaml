# Extraction: which method a new session and offline processing use by default, and how the
# methods are evaluated. Method parameters live in their own files (neural_tse.yaml,
# mask_baseline.yaml).

method: neural_tse               # neural_tse | mask_baseline | passthrough
                                 # neural_tse needs its checkpoint (neural_tse.yaml); without it
                                 # the session falls back to mask_baseline and says so

default_attenuation_db: 15       # how far non-target sound is turned down when nothing else is
                                 # asked for: the page's slider, a session, offline runs.
                                 # (The evaluation below uses its own value.)

offline:
  max_seconds: 300               # POST /api/recordings/{id}/process refuses longer files (413)
  chunk_frames: 4096             # block size when a whole file is fed through the extractor

evaluation:                      # soundspy evaluate extraction
  n: 500                         # test recipes (a fixed, seeded subset)
  seed: 1234
  sample_rate: 48000             # processing rate (the laptop microphone's native rate)
  attenuation_db: 30             # every system is compared at 30 dB (as in step 06)
  examples: 10                   # recipes rendered to outputs/eval/<experiment>/ for listening
  example_ids: [test-000036, test-000030]   # always among them (the step-06 extremes)
  live_delay_s: 0.05             # baseline, causal simulation: window end -> its result is in use
                                 # (inference ~30 ms on the GPU + up to one 20 ms chunk)
  reverb_seed: 4242              # rooms of the reverberant copy of the test subset
  # --- step 07b
  compare_checkpoint: experiments/tse_waveformer_v1/checkpoints/best.pt
                                 # the previous neural model, as its own row (null = none)
  high_attenuation_db: 40        # the neural method is also reported at this slider setting
  benchmarks:                    # fixed extra recipe sets made from the test clips
    seed: 707
    absent: 200                  # target-absent: every class in turn "selected but not there"
    pair: [speech, music]        # the owner's scenario: someone talks while music plays.
                                 # (B only, A selected) / (A + B, A selected) / (A + B, B selected)
    pair_n: 100                  # recipes per scenario
    pair_min_clip_s: 5.0         # class-B clips at least this long (sustained music)
    librispeech: 100             # recipes whose target is LibriSpeech test-clean speech
    examples: 3                  # listening examples written per benchmark
