# Global Sound Spy configuration.
# Relative paths are resolved against the project root (the folder containing backend/ and frontend/).

paths:
  # Small, personal: inside the project on C:
  raw: data/raw                                  # own free recordings, never modified
  custom: data/custom                            # own labelled clips (soundspy record-dataset)
  # Large data and caches: on D: (absolute paths are allowed; relative = project root)
  external: "D:/SoundSpyData/external"           # downloaded datasets (+ their archives)
  processed: "D:/SoundSpyData/processed"         # clip index, activity maps, caches
  mixtures: "D:/SoundSpyData/mixtures"           # mixture recipes (JSONL)
  model_cache: "D:/SoundSpyData/models"          # pretrained weights; TORCH_HOME/HF_HOME go here
  models: models                                 # our own small model files
  outputs: outputs                               # processed audio, plots, mixture previews
  experiments: experiments                       # one folder per training run

# Device profile from configs/devices/<name>.yaml
active_device_profile: laptop

capture:
  stall_timeout_s: 2.0          # no audio for this long -> MicStallError
  queue_chunks: 32              # input queue size (drop-oldest policy)
  startup_silence_max_s: 1.0    # leading exact-zero frames discarded at most
  latency: null                 # step 08: PortAudio's suggested latency: null (sounddevice's
                                # default, 'high'), 'low', or seconds
  exclusive: false              # step 08: WASAPI exclusive mode (other apps lose the microphone)

engine:
  chunk_ms: 20                  # processing chunk; frames = round(chunk_ms * sr / 1000)
  rtf_warning: 0.8              # warn when the p95 real-time factor exceeds this ...
  rtf_window_s: 2.0             # ... over this window (also the warning cool-down)
  status_interval_s: 1.0        # status message rate while a session runs
  thread_priority: pro_audio    # step 08: the audio worker thread's priority: pro_audio (Windows'
                                # audio scheduler, MMCSS), high, or normal

output:
  device: null                  # null = default output (WASAPI twin preferred) | index | name substring
  prebuffer_chunks: 2           # chunks queued before playback starts (jitter buffer)
  max_queue_chunks: 8           # above this, drop oldest (keeps latency bounded)
  limiter_ceiling_dbfs: -1.0    # safety limiter on everything sent to the speakers
  limiter_release_ms: 50        # how fast the limiter lets go after a peak
  default_gain_db: 0.0
  drain_after_s: 1.0            # queue above prebuffer_chunks + 1 for this long (after a stall the
                                # chunks arrive in a burst and nothing empties the queue again):
                                # drop the oldest chunks down to the prebuffer level
  drain_fade_ms: 5              # crossfade over the dropped stretch (no click)
  latency: null                 # step 08: as capture.latency
  exclusive: false              # step 08: WASAPI exclusive mode (other apps go silent)
  stall_timeout_s: 2.0          # step 08: no callback from the device for this long while the
                                # session runs = the device was lost (unplugged): error state

analysis:
  levels_hz: 20                 # LevelFrame rate
  spectrogram_hz: 25            # SpectrogramFrame rate
  spectrogram_fft: 2048
  spectrogram_bands: 128        # mel bands sent to the UI
  spectrogram_fmin_hz: 50
  spectrogram_db_floor: -100
  waveform_hz: 25               # WaveformFrame rate
  waveform_points: 64           # min/max pairs per WaveformFrame

api:
  host: 127.0.0.1
  port: 8765                 # 8000 is taken by Docker/WSL on the dev machine
  cors_origins: ["http://localhost:5173"]   # Vite dev server
  ws_heartbeat_s: 2.0        # status heartbeat on /ws/session while idle
  ws_client_queue: 64        # per-connection send queue; visual messages dropped oldest-first
  preload_models: true       # load and warm the live models in the background when the server
                             # starts (step 08), so the first session starts in about a second

database:
  url: sqlite:///data/soundspy.db   # relative sqlite path -> project root
