[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundspy"
version = "0.1.0"
description = "Sound Spy: listen to the environment and choose what to hear (UTCN Telecommunications project)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
]
# On Windows install torch/torchaudio FIRST from the official CUDA wheel index (see README).
# Tested (step 05): torch 2.11.0+cu126, torchaudio 2.11.0+cu126 (torchaudio has no builds for
# newer torch). Needed for detection/training; the data pipeline (extra "data") works without.
ml = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    # step 07c: the speech enhancer (DeepFilterNet3) runs its streaming step with ONNX Runtime
    # on the CPU (2.6 ms per 20 ms chunk vs 8-16 ms with PyTorch); onnx exports it once.
    # Tested: onnxruntime 1.32.0, onnx 1.23.2.
    "onnxruntime>=1.20",
    "onnx>=1.16",
]
spatial = [
    "pyroomacoustics>=0.7",
]
# Training data (step 04): downloads, clip index, mixture recipes. No torch.
data = [
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
soundspy = "soundspy.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: tests/io, tests/data, ... cannot shadow stdlib modules of the same name.
# step 08: tests slower than ~5 s are marked `slow` and left out of the default run (keeps it
# under ~2 minutes); `pytest -m slow` runs only them, `pytest -m "slow or not slow"` runs everything.
addopts = "--import-mode=importlib -m \"not slow\""
markers = [
    "gpu: needs an NVIDIA GPU (skipped by default; run with --run-gpu)",
    "data: needs downloaded datasets (skipped by default; run with --run-data)",
    "slow: takes more than ~5 s (left out of the default run; pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
