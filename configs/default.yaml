# Global SoundFocus configuration.
# All paths are relative to the project root.

paths:
  raw: data/raw              # ad-hoc recordings: native rate, all channels, never modified
  custom: data/custom        # self-recorded labelled clips (<label>/ folders + manifest.csv)
  external: data/external    # downloaded public datasets
  processed: data/processed  # derived / cached data (features, resampled copies)
  models: models             # checkpoints and downloaded pretrained weights
  outputs: outputs           # enhanced audio, plots, evaluation results

# Device profile from configs/devices/<name>.yaml
active_device_profile: laptop

sample_rates:
  capture: null       # null = device native rate. TODO(step-01): confirm per device
  processing: 16000   # rate used by classification/enhancement. TODO(step-05): match the model

# Project label set (public-dataset labels are mapped onto these in data/label_map.py)
labels:
  - speech
  - music
  - footsteps
  - dishes
  - chair_scrape
  - alarm
  - traffic
